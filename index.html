    <!-- Google AdSense - validation tag (required static placement in <head>) -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9503578701144532" crossorigin="anonymous"></script>

    <!-- AdSense lazy loader fallback (kept for backward compatibility) -->
    <script>
      (function () {
        var loaded = false;
        var events = ['scroll', 'pointerdown', 'keydown', 'touchstart'];
        function loadAds() {
          if (loaded) return;
          loaded = true;
          events.forEach(function (e) {
            window.removeEventListener(e, loadAds, true);
          });
          var s = document.createElement('script');
          s.async = true;
          s.crossOrigin = 'anonymous';
          s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9503578701144532';
          document.head.appendChild(s);
        }
        events.forEach(function (e) {
          window.addEventListener(e, loadAds, { passive: true, capture: true, once: true });
        });
        // Fallback so passive viewers still see ads
        setTimeout(loadAds, 8000);
      })();
    </script>
